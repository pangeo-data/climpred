name: CI  # based on https://github.com/pydata/xarray/blob/master/.github/workflows/ci.yaml

on:
  pull_request:
  schedule:
    - cron: "0 23 * * 0" # Sun 23:00 UTC
  workflow_dispatch: # allows you to trigger the workflow run manually

# Runner minutes are the scarce resource here, so the matrices below are
# deliberately event-dependent:
#
# * a pull request runs the *lean* matrix -- Linux only, oldest and newest
#   supported Python. macOS bills at 10x and Windows at 2x the runner minutes
#   of Linux, so those two platforms alone used to account for ~70% of the cost
#   of a single CI run while catching almost nothing Linux did not.
# * the weekly schedule and a manual ``workflow_dispatch`` run the *full*
#   matrix: every supported Python on Linux, macOS and Windows.
# * a pull request that needs the full matrix before merging can opt in with
#   the ``full-ci`` label. Labels are read from the event payload, so add the
#   label first and then re-run the workflow (or push again).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-ci-trigger:
    name: Detect CI trigger
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 2
      - uses: xarray-contrib/ci-trigger@10cd2bfec3484946a4058a421ddf9cfad101e715  # v1.2.1
        id: detect-trigger
        with:
          keyword: "[skip-ci]"

  minimum-test-pypi:  # Runs testing suite with minimal dependencies
    name: Test minimum dependencies (Python${{ matrix.python-version }}, ${{ matrix.os }}, pip)
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 45
    needs: detect-ci-trigger
    # ``detect-ci-trigger`` only runs for push/pull_request, so on ``schedule``
    # and ``workflow_dispatch`` it is skipped and ``triggered`` is empty. Without
    # ``always()`` the skipped dependency would skip this job too, which silently
    # reduced the weekly run to the doctest and notebook jobs.
    if: |
      always()
      && needs.detect-ci-trigger.result != 'failure'
      && needs.detect-ci-trigger.result != 'cancelled'
      && needs.detect-ci-trigger.outputs.triggered != 'true'
    defaults:
        run:
          shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        # See the comment at the top of the file: Linux only on pull requests,
        # every platform on the weekly schedule, on manual dispatch and on
        # pull requests labelled ``full-ci``.
        os: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '["ubuntu"]' || '["ubuntu", "macos", "windows"]') }}
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
            fetch-depth: 0 # Fetch all history for all branches and tags.
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install climpred (complete and dev dependencies)
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -e ".[complete]"
          python -m pip install --group dev
          python -m pip uninstall --yes netcdf4
      - name: Check dependencies
        run: |
          pip list
      - name: Locate tutorial data cache
        id: tutorial-cache
        run: |
          python -c "from pooch import os_cache; print('dir=' + str(os_cache('climpred-data')))" >> "$GITHUB_OUTPUT"
      - name: Restore tutorial datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.tutorial-cache.outputs.dir }}
          key: climpred-data-${{ runner.os }}-${{ hashFiles('src/climpred/tutorial.py') }}
      - name: Download missing tutorial datasets  # pytest-xdist fails otherwise
        run: |
          python -c "import climpred; climpred.tutorial._cache_all()"
      - name: Run tests
        run: |
          pytest -n auto --durations=20

  minimum-test-conda:  # Runs testing suite with minimal dependencies
    name: Test minimum dependencies (Python${{ matrix.python-version }} ubuntu, conda)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: detect-ci-trigger
    # ``detect-ci-trigger`` only runs for push/pull_request, so on ``schedule``
    # and ``workflow_dispatch`` it is skipped and ``triggered`` is empty. Without
    # ``always()`` the skipped dependency would skip this job too, which silently
    # reduced the weekly run to the doctest and notebook jobs.
    if: |
      always()
      && needs.detect-ci-trigger.result != 'failure'
      && needs.detect-ci-trigger.result != 'cancelled'
      && needs.detect-ci-trigger.outputs.triggered != 'true'
    defaults:
        run:
          shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
            fetch-depth: 0 # Fetch all history for all branches and tags.
      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476  # v3.0.0
        with:
          environment-file: ci/requirements/minimum-tests.yml
          environment-name: climpred-minimum-tests
          cache-environment: true
          create-args: >-
            python=${{ matrix.python-version }}
      - name: Install climpred (no deps) + remove netcdf4
        run: |
          python -m pip install --no-deps -e .
          python -m pip uninstall --yes netcdf4
      - name: Micromamba info
        run: |
          micromamba info
      - name: Micromamba list
        run: |
          micromamba list
      - name: Locate tutorial data cache
        id: tutorial-cache
        run: |
          python -c "from pooch import os_cache; print('dir=' + str(os_cache('climpred-data')))" >> "$GITHUB_OUTPUT"
      - name: Restore tutorial datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.tutorial-cache.outputs.dir }}
          key: climpred-data-${{ runner.os }}-${{ hashFiles('src/climpred/tutorial.py') }}
      - name: Download missing tutorial datasets  # pytest-xdist fails otherwise
        run: |
          python -c "import climpred; climpred.tutorial._cache_all()"
      - name: Run tests
        run: |
          pytest -n auto --durations=20

  maximum-test-conda:  # Runs testing suite with all optional dependencies
    name: Test optional dependencies (Python${{ matrix.python-version }}, ubuntu, conda)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: detect-ci-trigger
    # ``detect-ci-trigger`` only runs for push/pull_request, so on ``schedule``
    # and ``workflow_dispatch`` it is skipped and ``triggered`` is empty. Without
    # ``always()`` the skipped dependency would skip this job too, which silently
    # reduced the weekly run to the doctest and notebook jobs.
    if: |
      always()
      && needs.detect-ci-trigger.result != 'failure'
      && needs.detect-ci-trigger.result != 'cancelled'
      && needs.detect-ci-trigger.outputs.triggered != 'true'
    defaults:
        run:
          shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported Python on pull requests, the full range
        # on the weekly schedule, on manual dispatch and on ``full-ci`` PRs.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '["3.10", "3.13"]' || '["3.10", "3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
            fetch-depth: 0 # Fetch all history for all branches and tags.
      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476  # v3.0.0
        with:
          environment-file: ci/requirements/maximum-tests.yml
          environment-name: climpred-maximum-tests
          cache-environment: true
          create-args: >-
            python=${{ matrix.python-version }}
            esmpy
      - name: Install climpred (no deps) + remove netcdf4
        run: |
          python -m pip install --no-deps -e .
          python -m pip uninstall --yes netcdf4
      - name: Micromamba info
        run: |
          micromamba info
      - name: Micromamba list
        run: |
          micromamba list
      - name: Locate tutorial data cache
        id: tutorial-cache
        run: |
          python -c "from pooch import os_cache; print('dir=' + str(os_cache('climpred-data')))" >> "$GITHUB_OUTPUT"
      - name: Restore tutorial datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.tutorial-cache.outputs.dir }}
          key: climpred-data-${{ runner.os }}-${{ hashFiles('src/climpred/tutorial.py') }}
      - name: Download missing tutorial datasets  # pytest-xdist fails otherwise
        run: |
          python -c "import climpred; climpred.tutorial._cache_all()"
      # Coverage instrumentation slows the suite down measurably and four
      # identical reports tell us nothing the newest Python alone does not, so
      # only that entry measures and uploads coverage.
      - name: Run tests
        if: matrix.python-version != '3.13'
        run: |
          pytest -n auto --durations=20
      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: |
          pytest -n auto --durations=20 --cov=climpred --cov-report=xml
      - name: Upload coverage to codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  doctest:  # tests all docstrings
    name: Doctests (Python${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476  # v3.0.0
        with:
          environment-file: ci/requirements/maximum-tests.yml
          environment-name: climpred-maximum-tests
          cache-environment: true
          create-args: >-
            python=${{ matrix.python-version }}
      - name: Install climpred (no deps)
        run: |
          python -m pip install --no-deps -e .
      - name: Micromamba info
        run: |
          micromamba info
      - name: Micromamba list
        run: |
          micromamba list
      - name: Locate tutorial data cache
        id: tutorial-cache
        run: |
          python -c "from pooch import os_cache; print('dir=' + str(os_cache('climpred-data')))" >> "$GITHUB_OUTPUT"
      - name: Restore tutorial datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.tutorial-cache.outputs.dir }}
          key: climpred-data-${{ runner.os }}-${{ hashFiles('src/climpred/tutorial.py') }}
      - name: Run doctests
        run: |
          python -m pytest --doctest-modules src/climpred --ignore src/climpred/tests

  notebooks:  # Checks that pre-compiled notebooks in docs still work.
    name: Notebooks (Python${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
        run:
          shell: bash -l {0}
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476  # v3.0.0
        with:
          environment-file: ci/requirements/docs.yml
          environment-name: climpred-docs
          cache-environment: true
          create-args: >-
            python=${{ matrix.python-version }}
      - name: Install climpred (no deps)
        run: |
          python -m pip install --no-deps -e .
      - name: Micromamba info
        run: |
          micromamba info
      - name: Micromamba list
        run: |
          micromamba list
      - name: Locate tutorial data cache
        id: tutorial-cache
        run: |
          python -c "from pooch import os_cache; print('dir=' + str(os_cache('climpred-data')))" >> "$GITHUB_OUTPUT"
      - name: Restore tutorial datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.tutorial-cache.outputs.dir }}
          key: climpred-data-${{ runner.os }}-${{ hashFiles('src/climpred/tutorial.py') }}
      - name: Test notebooks in docs
        run: |
          pushd docs
          nbstripout source/*.ipynb source/examples/decadal/*.ipynb source/examples/monseas/*.ipynb examples/subseasonal/*ly-subx-example.html
          make -j4 html
          popd
